
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 取得 GitHub Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 設定 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 確認 Blazor 發布檔案
      - name: Verify Blazor files
        run: |
          echo "=== Check index.html ==="
          test -f index.html

          echo "=== Check base href ==="
          grep '<base href=' index.html

          echo "=== Check framework ==="
          test -d _framework
          ls -lh _framework/ | head -30

          echo "=== Check Blazor JS ==="
          grep -o 'dotnet\.[a-z0-9]*\.js' index.html | head -10

      # 4. 建立 GitHub Pages 必要檔案
      - name: Prepare Pages
        run: |
          touch .nojekyll
          cp index.html 404.html

      # 5. 上傳 GitHub Pages Artifact
      - name: Upload Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          include-hidden-files: true

      # 6. 確認 Artifact
      - name: Verify Artifact
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact_id }}"

      # 7. 部署至 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
