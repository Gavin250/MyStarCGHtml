name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify Blazor files
        run: |
          echo "=== index.html references ==="
          grep -o 'dotnet\.[a-z0-9]*\.js' index.html | head -10

          echo "=== Framework files ==="
          ls -lh _framework/ | head -30

          echo "=== SHA256 ==="
          sha256sum _framework/dotnet.*.js

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
